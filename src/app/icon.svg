<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer Geometric Star -->
  <g transform="translate(256 256)">
    <!-- 8-pointed star base -->
    <rect x="-140" y="-140" width="280" height="280" fill="none" stroke="url(#gold)" stroke-width="16" rx="24" />
    <rect x="-140" y="-140" width="280" height="280" fill="none" stroke="url(#gold)" stroke-width="16" rx="24" transform="rotate(45)" />

    <!-- Inner 8-pointed star slightly smaller and thinner -->
    <rect x="-100" y="-100" width="200" height="200" fill="none" stroke="url(#gold-light)" stroke-width="4" rx="16" opacity="0.6"/>
    <rect x="-100" y="-100" width="200" height="200" fill="none" stroke="url(#gold-light)" stroke-width="4" rx="16" opacity="0.6" transform="rotate(45)" />

    <!-- Book/Quran icon in the center -->
    <g transform="scale(1.3) translate(0, -6)">
      <!-- Left Page -->
      <path d="M -44 32 C -44 32, -22 -4, 0 12 C 0 12, 0 -36, 0 -36 C -22 -52, -44 -16, -44 -16 Z" fill="url(#gold)" />
      <!-- Right Page -->
      <path d="M 44 32 C 44 32, 22 -4, 0 12 C 0 12, 0 -36, 0 -36 C 22 -52, 44 -16, 44 -16 Z" fill="url(#gold)" />
      <!-- Center Line -->
      <path d="M 0 -36 L 0 16" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
      
      <!-- Randomness/Shuffle Arrows beneath the book -->
      <g transform="translate(0, 40) scale(0.6)">
        <path d="M -24 -12 C -12 -12, -4 4, 8 4 L 20 4 M 14 -2 L 20 4 L 14 10" fill="none" stroke="url(#gold-light)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M -24 4 C -12 4, -4 -12, 8 -12 L 20 -12 M 14 -18 L 20 -12 L 14 -6" fill="none" stroke="url(#gold-light)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>
</svg>
